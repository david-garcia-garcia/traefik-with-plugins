entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: true
  websecure:
    address: ":443"
log:
  level: "TRACE"
api:
  dashboard: true
  insecure: true
providers:
  docker:
    exposedByDefault: false
    # This socket is shared with other compose projects; only watch this stack.
    constraints: "Label(`com.docker.compose.project`, `traefik-with-plugins`)"
# TLS configuration for testing self-signed certificates
tls:
  # Enable default certificate generation for unmatched domains
  options:
    default:
      sslProtocols:
        - "TLSv1.2"
        - "TLSv1.3"
