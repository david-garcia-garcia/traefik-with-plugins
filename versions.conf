# Traefik and plugin versions (build pins, not runtime secrets).
# Used by Docker Compose --env-file, the image build, and release notes.
#   docker compose --env-file versions.conf up -d --build

# Traefik
TRAEFIK_REPO=github.com/traefik/traefik
TRAEFIK_VERSION=v3.7.13

# ModSecurity Plugin
PLUGIN_MODSECURITY_REPO=github.com/david-garcia-garcia/traefik-modsecurity
PLUGIN_MODSECURITY_VERSION=v1.8.1

# RealIP Plugin
PLUGIN_REALIP_REPO=github.com/david-garcia-garcia/traefik-realip
PLUGIN_REALIP_VERSION=v1.0.0-beta.3

# Geoblock Plugin
PLUGIN_GEOBLOCK_REPO=github.com/david-garcia-garcia/traefik-geoblock
PLUGIN_GEOBLOCK_VERSION=v1.2.1

# CrowdSec Bouncer Plugin (upstream)
PLUGIN_CROWDSEC_REPO=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
PLUGIN_CROWDSEC_VERSION=v1.4.5

# CrowdSec Bouncer Plugin (david-garcia-garcia fork)
PLUGIN_CROWDSECFORK_REPO=github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin
PLUGIN_CROWDSECFORK_VERSION=v1.9.0-beta.3

# Sablier Plugin
PLUGIN_SABLIER_REPO=github.com/sablierapp/sablier
PLUGIN_SABLIER_VERSION=v1.10.1
