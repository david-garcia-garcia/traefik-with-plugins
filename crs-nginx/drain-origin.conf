# In-process origin after CRS request phases on owasp/modsecurity-crs:4.3.0-nginx.
# Mount next to zz-realip.conf. Public :8080 proxy_pass'es here after ModSecurity.
# Do not put return on location / of :8080 (that skips CRS phases).
# Socket lives in /tmp/modsecurity (nginx-owned; same dir as MODSEC_AUDIT_LOG).
# max_ranges 0 so a tiny 200 is not 416.
# If-None-Match is omitted on proxy_pass (proxy_backend.drain.conf.template)
# so this return 200 is not rewritten to 304.
#
# Copied from david-garcia-garcia/traefik-modsecurity crs-nginx/drain-origin.conf

server {
    listen unix:/tmp/modsecurity/crs-drain.sock;
    server_name _;
    max_ranges 0;
    location / {
        default_type text/plain;
        return 200 "OK";
    }
}
