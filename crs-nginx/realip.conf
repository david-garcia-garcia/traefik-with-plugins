# Overlay for owasp/modsecurity-crs:4.3.0-nginx-alpine-202406090906.
# That pin puts real_ip only in includes/proxy_backend.conf (location /).
# ModSecurity is enabled at http level and reads REMOTE_ADDR before location
# real_ip runs. These http-level directives rewrite the client from Traefik's
# X-Real-IP first. Do not set 0.0.0.0/0.
#
# Copied from david-garcia-garcia/traefik-modsecurity crs-nginx/realip.conf

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;
